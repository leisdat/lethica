# Lethica v3.4.0 config
[server]
base = "http://127.0.0.1:20130/v1"   # routerku endpoint
key = "sk-routerku"                   # any non-empty key works (routerku bypass auth)

[model]
provider = "harbo"
default = "cline/z-ai/glm-5.3-flash"
failover = ["hy3::hy3", "routerku::Free-All", "routerku::Free-Kombo", "routerku::Free-Cline"]  # v2.9.5: eksplisit lintas-provider (dulu ["Free-All","hy3::hy3"] dua-duanya nunjuk b.ai → 404/429 → loop berhenti)
max_tokens = 16384
temperature = 0.4
max_tool_rounds = 32                  # max tool-loop per turn
max_continue_rounds = 12             # max auto-continue kalau output kepotong (terpisah dari tool)
window_size = 17                      # sliding window (mode 3)
stream = true                         # SSE streaming (teks realtime)
show_reasoning = false                # false = thinking gak di-liatin ke terminal
verifier_model = "cline/z-ai/glm-5.3-flash"                # verifier ketat: crosscheck final answer vs bukti tool (2026-09-19: default dari gpt-5.6-luna yg mati → cline/z-ai/glm-5.3-flash upstream langsung; kombo Free-All/Kombo/Cline flaky karena route ke b.ai balance=0/hc 500 — cline terbukti OK 2x + 4x di log routerku)

[persona]
mode = "bypass"                       # "bypass" (unbound+4mode) | "plain" (technical assistant only)
name = "lethica"

[tools]
danger_confirm = true                 # confirm dangerous shell commands
http_timeout = 180
search_limit = 5

[adaptive_planning]
enabled = true
max_candidates = 4
exploration_enabled = true
exploration_budget = 0.15
min_evidence_samples = 3
max_strategy_switches = 2

[skill_evolution]
enabled = true
max_candidates_per_task = 1
max_repair_iterations = 2
max_research_calls = 5
max_build_attempts = 2
max_test_attempts = 3
max_canary_tasks = 3
max_canary_failures = 1

[skills]
# Skill yang di-inject FULL ke system prompt saat startup (hemat katalog vs load-on-demand)
# Kosongkan [] kalau mau semua skill cuma di katalog (load via <skill name=.../>)
# CATATAN: jangan masukkan kategori raksasa (security/mlops/software-development/gamedev)
#          — itu ratusan skill, bakal bengkak context. Load via <skill name='...'/> on-demand.
autoload = [
    "bypass-modes",
    "termux-dev",
    "routerku",
    "github-first-push",
    "load-test-pro",
    "llm-prompt-design",
    # ── Lethica core layers (auto-inject full SKILL.md) ──
    "coding",
    "coding-core",
    "security",
    "qa",
    "deployment",
    "self-improve",
    "debugging",
    "reasoning-intelligence",
]

# ── v3.5 Semantic Long-Term Memory (Phase 5/6) ─────────────────────
# Default: SEMANTIC OFF (lexical fallback deterministic).
# Aktifkan dengan enabled=true + provider (routerku / openai-compatible).
# System TIDAK bergantung eksklusif pada embedding: kalau provider gagal,
# retrieval otomatis fallback ke lexical.
[memory]
[memory.semantic]
enabled = false
provider = "routerku"        # routerku | openai | (nanti bisa ditambah)
model = "text-embedding-3-small"
dimensions = 1536
top_k = 8
# catatan: butuh routerku punya endpoint /v1/embeddings (provider openai-compatible).
# Kalau gak ada, biarkan enabled=false → murni lexical hybrid.

# ── Multi-provider (v2.6) ────────────────────────────────────────
# Tambah provider baru: copy blok [providers.xxx], ganti base/key.
# Aktifkan via: /provider (pilih dari list) atau [model].provider di atas.
